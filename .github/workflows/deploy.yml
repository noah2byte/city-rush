# main에 푸시하면 빌드해서 GitHub Pages(https://noah2byte.github.io/city-rush/)에 배포한다.
# 블로그 저장소에 빌드 결과물을 복사해 넣지 않고 게임마다 따로 배포하는 이유:
#  - 게임 코드와 블로그 이력이 섞이지 않는다
#  - Chirpy 배포 워크플로의 htmlproofer 검사 대상에서 빠진다
#  - 사용자 사이트 도메인 아래 경로로 서빙되므로 블로그와 같은 출처(origin)라 iframe 임베드에 제약이 없다
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages가 OIDC 토큰으로 배포 권한을 증명한다

concurrency:
  group: pages
  cancel-in-progress: true # 연속 푸시 시 이전 배포를 기다리지 않고 최신 것만 배포한다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 외부 자산 원본(12MB+)을 매번 받지 않도록 캐시한다.
      # 출처·가공 방법이 바뀌면 스크립트가 바뀌므로 스크립트 해시를 키로 쓴다
      - uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ hashFiles('scripts/build-assets.mjs') }}
      - run: npm ci # lock 파일 그대로 설치해 로컬과 같은 버전으로 빌드한다
      - run: npm run build # prebuild 훅이 자산 다운로드·가공을 먼저 수행한다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
